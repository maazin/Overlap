# Fly.io configuration for the Overlap API.
#
# First deploy:
#   fly apps create overlap-api
#   fly postgres create --name overlap-db      # then: fly postgres attach overlap-db
#   fly secrets set ALLOWED_ORIGINS=https://<your-vercel-domain> \
#                   WEB_URL=https://<your-vercel-domain>
#   fly deploy
#
# `fly postgres attach` sets DATABASE_URL for you; do not set it by hand.
#
# Both secrets above matter and fail differently. A missing ALLOWED_ORIGINS is
# loud: every browser request fails CORS immediately. A missing WEB_URL is
# silent: the API falls back to localhost and writes that into the URL field of
# every downloaded .ics, which still downloads and still imports.
#
# Migrations run at startup from inside the binary, so there is no release
# command here and no goose in this image. See internal/migrate.

app = 'overlap-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true

  # Phase 5 adds SSE, and a machine suspended out from under an open stream
  # drops it. One always-on machine keeps that honest; scale up when there is
  # traffic to justify it.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '5s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
