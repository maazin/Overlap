<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Overlap">
  <!-- Two spans of time, and the part they share. Sharp corners and the same
       ink and pine the interface uses, so the mark sits in the palette rather
       than beside it. -->
  <rect width="32" height="32" fill="#f4f1ec"/>
  <rect x="5" y="9" width="14" height="14" fill="#1b1a17"/>
  <rect x="13" y="9" width="14" height="14" fill="#24443a" fill-opacity="0.92"/>
  <rect x="13" y="9" width="6" height="14" fill="#0f1f19"/>
</svg>
