# Render blueprint for the Overlap API.
#
# The database is deliberately not defined here. Render's free Postgres expires
# 30 days after creation and is then deleted, which is a data-loss deadline
# rather than a free tier. Point DATABASE_URL at a provider whose free plan is
# permanent instead; Neon is what the README documents.
#
# First deploy:
#   1. Create the database elsewhere and copy its connection string.
#   2. New > Blueprint in the Render dashboard, point it at this repo.
#   3. Set DATABASE_URL and WEB_URL, both marked sync: false below.
#   4. After the web app is deployed, set ALLOWED_ORIGINS to its origin.
services:
  - type: web
    name: overlap-api
    runtime: docker
    plan: free
    rootDir: api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health

    envVars:
      - key: APP_ENV
        value: production

      # Render runs behind Cloudflare, so the socket address is a proxy and
      # both of these are single-value headers that proxy overwrites. The first
      # one present on a request wins.
      #
      # Not X-Forwarded-For. It is a list, and with two proxies in front its
      # last entry is an internal hop that changes between requests, so every
      # request lands in its own bucket and nothing is ever limited. That is
      # what this was set to originally, and 45 concurrent requests against
      # production returned zero refusals.
      - key: CLIENT_IP_HEADER
        value: True-Client-IP, CF-Connecting-IP

      # Set in the dashboard. DATABASE_URL is a credential and does not belong
      # in a file in a public repo; the other two are not known until the web
      # app has a URL.
      - key: DATABASE_URL
        sync: false
      - key: WEB_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
